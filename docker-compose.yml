services:
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "./docker/database/mysql:/var/lib/mysql"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fleetbase"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  socket:
    image: socketcluster/socketcluster:v17.4.0
    restart: unless-stopped
    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10
    networks: [internal, infra_edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_edge
      - traefik.http.routers.fleetbase-socket.entrypoints=websecure
      - traefik.http.routers.fleetbase-socket.rule=Host(`${FLEETBASE_SOCKET_HOST}`)
      - traefik.http.routers.fleetbase-socket.tls=true
      - traefik.http.services.fleetbase-socket.loadbalancer.server.port=8000

  scheduler:
    image: fleetbase/fleetbase-api:latest
    restart: unless-stopped
    command: ["go-crond", "--verbose", "root:./crontab"]
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SOCKETCLUSTER_HOST: socket
      SOCKETCLUSTER_PORT: 8000
      SOCKETCLUSTER_SECURE: "false"
    depends_on: [database, cache]
    networks: [internal]

  queue:
    image: fleetbase/fleetbase-api:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work"]
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SOCKETCLUSTER_HOST: socket
      SOCKETCLUSTER_PORT: 8000
      SOCKETCLUSTER_SECURE: "false"
    depends_on: [database, cache]
    networks: [internal]

  console:
    image: fleetbase/fleetbase-console:latest
    restart: unless-stopped
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json
    networks: [internal, infra_edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_edge
      - traefik.http.routers.fleetbase-console.entrypoints=websecure
      - traefik.http.routers.fleetbase-console.rule=Host(`${FLEETBASE_CONSOLE_HOST}`)
      - traefik.http.routers.fleetbase-console.tls=true
      - traefik.http.services.fleetbase-console.loadbalancer.server.port=4200

  application:
    image: fleetbase/fleetbase-api:latest
    restart: unless-stopped
    volumes:
      - ./api/.env:/fleetbase/api/.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache

      # CORS / console awareness
      CONSOLE_HOST: https://${FLEETBASE_CONSOLE_HOST}
      FRONTEND_HOSTS: https://${FLEETBASE_CONSOLE_HOST}

      # sockets (API talks to socket internally)
      BROADCAST_DRIVER: socketcluster
      SOCKETCLUSTER_HOST: socket
      SOCKETCLUSTER_PORT: 8000
      SOCKETCLUSTER_SECURE: "false"

      MAIL_FROM_NAME: Fleetbase
      APP_NAME: Fleetbase
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: 'true'
      OSRM_HOST: https://router.project-osrm.org
      SESSION_DOMAIN: ${SESSION_DOMAIN:-localhost}
    depends_on: [database, cache, queue]
    networks: [internal]

  httpd:
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    restart: unless-stopped
    depends_on: [application]
    networks: [internal, infra_edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_edge
      - traefik.http.routers.fleetbase.entrypoints=websecure
      - traefik.http.routers.fleetbase.rule=Host(`${FLEETBASE_HTTPD_HOST}`)
      - traefik.http.routers.fleetbase.tls=true
      - traefik.http.services.fleetbase.loadbalancer.server.port=80
      # Optional (if your Traefik uses a named certresolver, e.g. "le"):
      # - traefik.http.routers.fleetbase.tls.certresolver=le
      # - traefik.http.routers.fleetbase-console.tls.certresolver=le
      # - traefik.http.routers.fleetbase-socket.tls.certresolver=le

networks:
  internal:
    name: fleetbase_internal
    driver: bridge
    internal: true
  infra_edge:
    external: true
    name: infra_edge
